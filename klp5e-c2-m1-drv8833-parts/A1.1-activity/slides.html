<!--
  IMAGE DECK TEMPLATE
  ───────────────────
  A deck for a lecture whose slides are rendered images rather than text layouts.
  Do not fill this in by hand. `tools/build-diagram-states.py --deck` renders the
  states from the source SVG and writes the finished deck, so the artwork and the
  deck cannot drift apart. It substitutes two placeholders, each spelled as the
  word below wrapped in a leading and a trailing pair of underscores. They are
  not written out literally here, because the builder would substitute this
  comment too and embed a second copy of every image.

    TITLE     the <title> text
    SLIDES    one <img class="slide"> per state, base64 data URIs

  The images are embedded rather than referenced because `copy_slides.py` and
  `notes_push.py` publish `slides/slides.html` on its own and carry no assets
  beside it. A deck that referenced its images by relative path would reach
  students broken.

  For the companion text-slide deck, with 11 built-in layouts, see
  slide_deck_template.html.

  BRAND LOGO
  ──────────
  The Tech Explorations mark (.brand, bottom-left) is embedded here as base64,
  outside the SLIDES placeholder region, so every deck built from this template
  carries it automatically — no per-lecture step needed. It stays visible always
  (unlike .chrome, which fades on idle and hides in fullscreen), since it is
  branding rather than a playback control.

  A slide whose artwork runs into that corner carries data-brand="top-right",
  written by the builder when the source <svg> asks for it, and the logo moves
  under the running header while that slide is on screen.
-->
<style>
/* Ground is the artwork's own #0D1117, so the letterbox around a 16:9 frame in a
   window of any other aspect reads as part of the slide, not as a band. */
html, body {
  height: 100%;
  margin: 0;
  background: #0D1117;
  overflow: hidden;
  -webkit-text-size-adjust: 100%;
}

.stage { position: fixed; inset: 0; }

/* Every state stays in the DOM. Hidden states are `visibility: hidden` rather
   than `display: none` so the layout never reflows on a cut, and the script
   warms each decode at load, so advancing is instant. No transition: the states
   nest, and a crossfade between nested frames reads as nothing happening. */
.slide {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  visibility: hidden;
  user-select: none;
  -webkit-user-drag: none;
}
.slide.on { visibility: visible; }

/* Chrome. Everything here must be able to leave the frame: it fades out after
   two seconds of pointer stillness, and fullscreen removes it outright. */
.chrome {
  position: fixed;
  left: 50%;
  bottom: max(18px, env(safe-area-inset-bottom));
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 8px;
  border-radius: 999px;
  background: rgba(22, 29, 39, .88);
  border: 1px solid #2A3441;
  opacity: 1;
  transition: opacity .35s ease;
}
body.idle .chrome { opacity: 0; }
body.idle { cursor: none; }
body.fs .chrome { display: none; }

.chrome button {
  appearance: none;
  border: 0;
  background: transparent;
  color: #9AA7B4;
  font: 600 15px/1 Inter, system-ui, sans-serif;
  padding: 6px 10px;
  border-radius: 999px;
  cursor: pointer;
}
.chrome button:hover:not(:disabled) { background: #1F2833; color: #F2F5F8; }
.chrome button:disabled { opacity: .3; cursor: default; }

#ctr {
  color: #9AA7B4;
  font: 400 12px/1 "DejaVu Sans Mono", ui-monospace, monospace;
  letter-spacing: .06em;
  min-width: 42px;
  text-align: center;
}

/* Keyboard focus must stay visible for anyone driving the deck without a mouse. */
.chrome button:focus-visible { outline: 2px solid #60A5FA; outline-offset: 2px; }

/* Branding. Always on: does not fade with .chrome and is not removed in
   fullscreen, so it stays on screen through a recording. Position is in vw/vh,
   not px: the artwork is a fixed 1920x1080 (16:9) canvas scaled to fill the
   window, and only a viewport-relative unit tracks that scaling at whatever
   resolution the window is actually recorded at. (1vw/1vh = 19.2/10.8 of the
   canvas's own units when the window is 16:9, regardless of its pixel size.) */
.brand {
  /* The artwork is object-fit: contain, so in a window that is not 16:9 it
     letterboxes and vw/vh no longer land on the same artwork coordinates.
     --fw/--fh are the size of the rendered 16:9 frame; the logo is placed
     inside that frame, at 180,945 of the 1920x1080 canvas (above the line). */
  --fw: min(100vw, calc(100vh * 16 / 9));
  --fh: min(100vh, calc(100vw * 9 / 16));
  position: fixed;
  left: calc((100vw - var(--fw)) / 2 + var(--fw) * 0.09375);
  bottom: calc((100vh - var(--fh)) / 2 + var(--fh) * 0.125);
  width: calc(var(--fw) * 0.078125);
  height: auto;
  opacity: .55;
  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
  z-index: 2;
}
/* Top right, under the running header: 1660,112 of the canvas, so the logo's
   right edge lines up with the header's at x 1810. */
body.brand-top-right .brand {
  left: calc((100vw - var(--fw)) / 2 + var(--fw) * 0.864583);
  bottom: auto;
  top: calc((100vh - var(--fh)) / 2 + var(--fh) * 0.103704);
}
</style>

<script>
(function () {
  var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
  var ctr = document.getElementById('ctr');
  var prev = document.getElementById('prev');
  var next = document.getElementById('next');
  var cur = 0;

  function go(n) {
    n = Math.max(0, Math.min(n, slides.length - 1));
    if (n === cur) { return; }
    slides[cur].classList.remove('on');
    cur = n;
    slides[cur].classList.add('on');
    paint();
  }

  function paint() {
    document.body.classList.toggle('brand-top-right',
      slides[cur].getAttribute('data-brand') === 'top-right');
    ctr.textContent = (cur + 1) + ' / ' + slides.length;
    prev.disabled = cur === 0;
    next.disabled = cur === slides.length - 1;
  }

  // Decode every state up front so a cut never waits on the image pipeline.
  slides.forEach(function (img) {
    if (img.decode) { img.decode().catch(function () {}); }
  });

  slides[0].classList.add('on');
  paint();

  /* ── chrome auto-hide ──────────────────────────────────────────────── */
  var idleTimer;
  function wake() {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () {
      document.body.classList.add('idle');
    }, 2000);
  }
  ['pointermove', 'pointerdown', 'keydown'].forEach(function (evt) {
    document.addEventListener(evt, wake, { passive: true });
  });
  wake();

  /* ── fullscreen ────────────────────────────────────────────────────── */
  function toggleFullscreen() {
    if (document.fullscreenElement) {
      document.exitFullscreen();
    } else if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(function () {});
    }
  }
  document.addEventListener('fullscreenchange', function () {
    document.body.classList.toggle('fs', !!document.fullscreenElement);
  });
  document.getElementById('fs').addEventListener('click', function (e) {
    e.stopPropagation();
    toggleFullscreen();
  });

  /* ── input ─────────────────────────────────────────────────────────── */
  prev.addEventListener('click', function (e) { e.stopPropagation(); go(cur - 1); });
  next.addEventListener('click', function (e) { e.stopPropagation(); go(cur + 1); });

  document.getElementById('stage').addEventListener('click', function () { go(cur + 1); });

  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) { return; }
    switch (e.key) {
      case 'ArrowRight': case ' ': case 'PageDown': case 'Enter':
        e.preventDefault(); go(cur + 1); break;
      case 'ArrowLeft': case 'PageUp': case 'Backspace':
        e.preventDefault(); go(cur - 1); break;
      case 'Home': e.preventDefault(); go(0); break;
      case 'End':  e.preventDefault(); go(slides.length - 1); break;
      case 'f': case 'F': e.preventDefault(); toggleFullscreen(); break;
    }
  });

  var touchX = null;
  document.addEventListener('touchstart', function (e) {
    touchX = e.changedTouches[0].clientX;
  }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (touchX === null) { return; }
    var dx = e.changedTouches[0].clientX - touchX;
    touchX = null;
    if (Math.abs(dx) < 40) { return; }   // below this it is a tap, handled as a click
    go(dx < 0 ? cur + 1 : cur - 1);
  }, { passive: true });
})();
</script>
